<!DOCTYPE html>
<html>

<head>
    <title>Betty's Coffee Shop</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Betty's Coffee Shop</h1>
    <p>Choose your favorite coffee.</p>


    <!-- Coffee Menu -->
    <div class="coffee-menu">


        <!-- Coffee 1 -->
        <div class="coffee-card">

            <img src="Images/latte.jpg" alt="Latte">

            <h2>Latte</h2>

            <p>$5.00</p>

            <button>Choose</button>

        </div>


        <!-- Coffee 2 -->
        <div class="coffee-card">

            <img src="Images/americano.jpg" alt="Americano">

            <h2>Americano</h2>

            <p>$4.00</p>

            <button>Choose</button>

        </div>


        <!-- Coffee 3 -->
        <div class="coffee-card">

            <img src="Images/cappuccino.jpg" alt="Cappuccino">

            <h2>Cappuccino</h2>

            <p>$5.50</p>

            <button>Choose</button>

        </div>


    </div>


    <!-- Customize -->
    <div>

        <h2>Customize Your Drink</h2>

        <p>Sugar: Not Added</p>

        <button>Add Sugar</button>

    </div>


    <!-- Order -->
    <div>

        <h2>Your Order</h2>

        <p>No coffee selected yet.</p>

        <p>Total: $0.00</p>

        <button>Clear Order</button>

    </div>


    <script src="script.js"></script>

</body>

</html>
